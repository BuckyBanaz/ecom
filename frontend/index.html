    <!-- Scripts -->
    <script>
      (function() {
        try {
          var pref = (navigator.languages && navigator.languages[0]) || navigator.language;
          if (pref) {
            document.documentElement.lang = pref.split('-')[0];
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("cms_homepage_data");
          if (!raw) return;
          var data = JSON.parse(raw);
          if (!data || !data.content) return;
          var content = data.content;
          var m =
            content.match(/background_image_1="([^"]+)"/i) ||
            content.match(/background_image="([^"]+)"/i) ||
            content.match(/<img[^>]+src="([^"]+)"/i);
          if (!m || !m[1] || m[1].indexOf("/uploads/") === -1) return;
          var path = m[1].slice(m[1].indexOf("/uploads/"));
          var href = path + (path.indexOf("?") >= 0 ? "&" : "?") + "w=960";
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json" id="organization-schema">


    {

      "@context": "https://schema.org",

      "@type": ["Organization", "OnlineStore"],

      "@id": "https://schipenster.com/#organization",

      "name": "Schip & Ster",

      "url": "https://schipenster.com",

      "description": "Shop indoor & outdoor lighting, LED bulbs and smart home fixtures. Ordered before 22:00, delivered next day in NL. 30-day free returns.",

      "logo": {

        "@type": "ImageObject",

        "url": "https://schipenster.com/favicon-192x192.png",

        "width": 192,

        "height": 192

      },

      "image": "https://schipenster.com/og-image.png",

      "contactPoint": {

        "@type": "ContactPoint",

        "contactType": "customer service",

        "email": "info@schipenster.nl",

        "availableLanguage": ["Dutch", "English"]

      },

      "areaServed": { "@type": "Country", "name": "Netherlands" }

    }

    </script>

    <script type="application/ld+json" id="website-schema">

    {

      "@context": "https://schema.org",

      "@type": "WebSite",

      "@id": "https://schipenster.com/#website",

      "name": "Schip & Ster",

      "alternateName": ["Schip en Ster"],

      "url": "https://schipenster.com",

      "publisher": { "@id": "https://schipenster.com/#organization" },

      "potentialAction": {

        "@type": "SearchAction",

        "target": {

          "@type": "EntryPoint",

          "urlTemplate": "https://schipenster.com/category?search={search_term_string}"

        },

        "query-input": "required name=search_term_string"

      }

    }

    </script>

    <script type="application/ld+json" id="navigation-schema">

    {

      "@context": "https://schema.org",

      "@type": "ItemList",

      "name": "Main navigation",

      "itemListElement": [

        { "@type": "SiteNavigationElement", "position": 1, "name": "Home", "url": "https://schipenster.com/" },

        { "@type": "SiteNavigationElement", "position": 2, "name": "Categories", "url": "https://schipenster.com/categories" },

        { "@type": "SiteNavigationElement", "position": 3, "name": "Brands", "url": "https://schipenster.com/brands" },

        { "@type": "SiteNavigationElement", "position": 4, "name": "Blog", "url": "https://schipenster.com/blogs" },

        { "@type": "SiteNavigationElement", "position": 5, "name": "FAQs", "url": "https://schipenster.com/faqs" }

      ]

    }

    </script>
