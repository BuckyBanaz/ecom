name: ecom

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ecom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecom_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: https://${DOMAIN}
      API_URL: https://api.${DOMAIN}
      ENABLE_REDIS: "true"
      SETTINGS_ENV_FILE: /app/.env.production
      SEO_FILES_DIR: /app/seo
    volumes:
      - backend_uploads:/app/public/uploads
      - backups_data:/app/backups
      - seo_files:/app/seo
      - ./.env.production:/app/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_APP_URL: https://${DOMAIN}
        SEO_SITE_NAME: ${SEO_SITE_NAME:-Schip & Ster}
        SEO_DEFAULT_TITLE: ${SEO_DEFAULT_TITLE:-Schip & Ster — Light up your moment}
        SEO_DEFAULT_DESCRIPTION: ${SEO_DEFAULT_DESCRIPTION:-Shop indoor & outdoor lighting, LED bulbs and smart home fixtures. Ordered before 22:00, delivered next day in NL. 30-day free returns.}
        SEO_OG_IMAGE: ${SEO_OG_IMAGE:-https://schipenster.com/og-image.png}
        SEO_CANONICAL_URL: ${SEO_CANONICAL_URL:-https://schipenster.com/}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backups_data:
  seo_files:
  caddy_data:
  caddy_config:
